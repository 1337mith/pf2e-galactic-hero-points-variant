name: Build Release ZIP

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from git tag
      id: vars
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Run tests
      run: node --test "tests/**/*.test.mjs"

    - name: Verify tag version matches module.json
      run: |
        MODULE_VERSION=$(node -p "require('./module.json').version")
        if [ "$MODULE_VERSION" != "$VERSION" ]; then
          echo "::error::Tag version ($VERSION) does not match module.json version ($MODULE_VERSION)"
          exit 1
        fi

    - name: Create ZIP archive with version in name
      run: |
        FILES="module.json scripts"
        for f in README.md LICENSE; do [ -f "$f" ] && FILES="$FILES $f"; done
        zip -r pf2e-galactic-hero-points-variant-${VERSION}.zip $FILES
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pf2e-galactic-hero-points-variant-${{ env.VERSION }}.zip
        path: pf2e-galactic-hero-points-variant-${{ env.VERSION }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: "Automated release for version ${{ github.ref_name }}."
        draft: false
        prerelease: false
        files: pf2e-galactic-hero-points-variant-${{ env.VERSION }}.zip
